[audio]
spectrum_frame_rate = 144

[bar]
order = [ "main" ]

    [bar.main]
    background_opacity = 0.79999998211860657
    center = [ "clock", "control-center", "date", "weather" ]
    end = [
        "media",
        "tray",
        "notifications",
        "clipboard",
        "notes",
        "network",
        "volume",
        "widget",
        "battery",
        "nix-monitor"
    ]
    margin_edge = 10
    margin_ends = 10
    radius = 5
    start = [ "launcher", "workspaces" ]
    thickness = 30

        [bar.main.monitor.DP-2]
        center = [ "clock", "control-center", "date" ]
        end = [ "group:g1" ]
        position = "bottom"
        start = [ "launcher", "workspaces" ]

            [[bar.main.monitor.DP-2.capsule_group]]
            accordion = false
            accordion_direction = "end"
            border_width = 1.0
            enabled = true
            fill = "surface_container"
            id = "g1"
            members = [ "network_rx", "ram", "temp" ]
            opacity = 1.0
            padding = 6.0

[bluetooth]
connection_notifications = true

[brightness]
enable_ddcutil = true

[calendar]
dedupe_events = true
enabled = true
event_time_format = "{:%-I:%M %p}"

    [calendar.account.personal_google]
    name = "Gmail"
    type = "google"

    [calendar.account.ub_google]
    name = "UB"
    type = "google"

[control_center]
sidebar = "full"
sidebar_section = "full"
width = 900

    [control_center.calendar]
    show_events_location = true
    show_week_numbers = true

[dock]
active_monitor_only = true
auto_hide = true
enabled = true
icon_size = 36
reserve_space = false

[location]
address = "Belmopan, Belize"

[lockscreen]
transition = [ "pixel" ]
transition_duration = 1000

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [
    "lockscreen-login-box@DP-1",
    "lockscreen-login-box@DP-2",
    "lockscreen-widget-0000000000000001",
    "lockscreen-widget-0000000000000002",
    "lockscreen-widget-0000000000000003"
]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 1024.0
    cy = 970.0
    output = "DP-1"
    placement_height = 1152.0
    placement_width = 2048.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_media_controls = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-2"]
    box_height = 196.0
    box_width = 810.0
    cx = 576.0
    cy = 1866.0
    output = "DP-2"
    placement_height = 2048.0
    placement_width = 1152.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-2".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_media_controls = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000001]
    box_height = 416.0
    box_width = 608.0
    cx = 1125.0
    cy = 592.0
    output = "DP-1"
    placement_height = 1152.0
    placement_width = 2048.0
    rotation = 0.0
    type = "calendar"

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000002]
    box_height = 176.0
    box_width = 176.0
    cx = 712.0
    cy = 472.0
    output = "DP-1"
    placement_height = 1152.0
    placement_width = 2048.0
    rotation = 0.0
    type = "clock"

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000003]
    box_height = 224.0
    box_width = 176.0
    cx = 712.0
    cy = 688.0
    output = "DP-1"
    placement_height = 1152.0
    placement_width = 2048.0
    rotation = 0.0
    type = "noctalia/timer:desktop"

[notification]
background_opacity = 0.79999998211860657
monitors = [ "DP-1" ]
offset_x = 10
offset_y = 10

[osd]
background_opacity = 0.79999998211860657
border = false
monitors = [ "DP-2" ]
offset_x = 10
offset_y = 10
position = "bottom_right"

[plugins]
enabled = [
    "noctalia/notes",
    "noctalia/timer",
    "noctalia/translator",
    "avivbintangaringga/nix-monitor",
    "vavadik/headsetcontrol"
]

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/official-plugins"
    name = "official"

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/community-plugins"
    name = "community"

[shell]
avatar_path = "/home/packet/Pictures/nixconfig-avatars/crow.png"
circular_avatar = false
clipboard_confirm_clear_history = false
external_ip_enabled = true
password_style = "random"
polkit_agent = true
screen_time_enabled = true
settings_window_translucent = true
telemetry_enabled = true
umbriel_audio_provider_enabled = true
umbriel_overview_close_on_launch_enabled = true
umbriel_overview_type_to_launch_enabled = true

    [shell.greeter_sync]
    auto_sync = true

    [shell.launcher]
    category_icons_only = true
    search_position = "top"

        [shell.launcher.providers.emoji]
        global = true

        [shell.launcher.providers.session]
        global = true

    [shell.panel]
    borders = false
    transparency_mode = "glass"

    [shell.screenshot]
    annotate = true
    confirm_region = true
    directory = "/home/packet/Pictures/Screenshots"
    remember_last_region = true
    skip_annotate_on_copy_save = true

    [shell.window_switcher]
    current_workspace_only = true
    mru = true
    show_all_outputs = false
    style = "grid"

[theme]
source = "wallpaper"

    [theme.templates]
    builtin_ids = [ "btop", "gtk3", "gtk4", "luciole", "qt", "umbriel" ]

[wallpaper]
directory = "/home/packet/Pictures/Wallpapers"
transition = [ "pixel" ]
transition_duration = 1000
transition_on_startup = true

    [wallpaper.last]
    path = "/home/packet/Pictures/Wallpapers/nixconfig-wallpapers/cobalt-core-2.png"

    [wallpaper.monitors.DP-1]
    path = "/home/packet/Pictures/Wallpapers/nixconfig-wallpapers/cobalt-core-2.png"

    [wallpaper.monitors.DP-2]
    path = "/home/packet/Pictures/Wallpapers/vertical/cobalt-core-1.png"

[weather]
unit = "imperial"

[widget.clock]
format = "{:%-I:%M %p}"

[widget.control-center]
anchor = true
glyph = "paw-filled"

[widget.date]
format = "{:%e %b %Y}"

[widget.media]
hide_artist = true
hide_when_no_media = true
show_progress = true
title_scroll = "on_hover"

[widget.network]
show_label = false

[widget.network_rx]
visualization = "none"

[widget.nix-monitor]
show_text = false
type = "avivbintangaringga/nix-monitor:nix-monitor"

[widget.notes]
type = "noctalia/notes:notes"

[widget.ram]
visualization = "none"

[widget.sysmon]
stat = "cpu_temp"
visualization = "none"

[widget.temp]
visualization = "none"

[widget.tray]
drawer = true
drawer_columns = 4

[widget.volume]
show_label = false

[widget.weather]
show_condition = false

[widget.widget]
type = "vavadik/headsetcontrol:widget"

[widget.workspaces]
max_label_chars = 4
